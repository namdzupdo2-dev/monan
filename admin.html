<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Quản lý menu</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f2f0;color:#222;font:15px/1.5 system-ui,sans-serif;padding:16px 16px 100px}
.wrap{max-width:760px;margin:auto}
h1{font-size:1.4rem;margin:0 0 12px}
section{background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;margin-bottom:16px}
h2{font-size:1.05rem;margin:0 0 10px}
label{display:block;font-size:.85rem;color:#555;margin:10px 0 3px}
input{width:100%;padding:8px;border:1px solid #bbb;border-radius:6px;font:inherit}
input[type=color]{padding:2px;height:40px;width:70px}
.colors{display:flex;gap:18px;flex-wrap:wrap}
.cat{border:1px solid #ccc;border-radius:8px;padding:12px;margin-top:12px;background:#fafafa}
.cat-head{display:flex;gap:8px}
.it{display:grid;grid-template-columns:56px 2fr 2fr 1fr auto auto;gap:6px;margin-top:8px;align-items:center}
.bs{display:flex;align-items:center;gap:4px;margin:0;white-space:nowrap;font-size:.85rem}.bs input{width:auto}
@media(max-width:560px){.it{grid-template-columns:56px 1fr 1fr}}
button{padding:8px 12px;border-radius:6px;border:1px solid #888;background:#fff;font:inherit;cursor:pointer}
button.pri{background:#1f5f4a;color:#fff;border-color:#1f5f4a;font-weight:600}
button.del{color:#b00020;border-color:#e0b0b8}
button:focus-visible,input:focus-visible{outline:3px solid #1f5f4a;outline-offset:2px}
#save{position:fixed;left:0;right:0;bottom:0;border-radius:0;padding:16px;border:0}
#status{margin:8px 0;font-weight:600}
.hide,[hidden]{display:none!important}
.hint{font-size:.85rem;color:#666;margin:0 0 6px}
.cr{margin-top:10px}.cw{display:flex;gap:8px;align-items:center}.sw{flex:none;width:38px;height:38px;border-radius:6px;border:1px solid #aaa;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/10px 10px}
.phw{position:relative;width:56px;height:56px}
.ph{display:flex;align-items:center;justify-content:center;width:56px;height:56px;margin:0;border:2px dashed #aaa;border-radius:8px;cursor:pointer;overflow:hidden;font-size:1.4rem;color:#777;background:#fff}
.pv{width:100%;height:100%;object-fit:cover}
.x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;padding:0;border-radius:50%;line-height:1;background:#b00020;color:#fff;border:0}
</style>
</head>
<body>
<div class="wrap">
<h1>Quản lý menu</h1>
<div id="status" role="status"></div>

<section id="login">
  <h2>Đăng nhập chủ quán</h2>
  <label for="email">Email</label><input id="email" type="email" autocomplete="username">
  <label for="pass">Mật khẩu</label><input id="pass" type="password" autocomplete="current-password">
  <p><button class="pri" id="signin">Đăng nhập</button></p>
</section>

<div id="editor" class="hide">
  <p><button id="signout">Đăng xuất</button></p>
  <section>
    <h2>Thông tin quán</h2>
    <label for="shop">Tên quán</label><input id="shop">
    <label for="tagline">Câu giới thiệu</label><input id="tagline">
  </section>
  <section>
    <h2>Màu sắc</h2>
    <p class="hint">Gõ mã màu dạng chữ, ví dụ <b>#000000</b> (đen), <b>#ffffff</b> (trắng), <b>#c9972b</b>, hoặc tên màu như <b>black</b>. Ô để trống thì web tự chọn màu hợp với các màu còn lại.</p>
    <div id="colors"></div>
  </section>
  <section>
    <h2>Món ăn</h2>
    <div id="cats"></div>
    <p><button id="addcat">+ Thêm nhóm món</button></p>
  </section>
</div>
</div>
<button class="pri hide" id="save" type="button">Lưu, khách thấy ngay</button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const val = s => String(s ?? "").replace(/"/g,"&quot;");
const say = (t, bad) => { $("status").textContent = t; $("status").style.color = bad ? "#b00020" : "#1f5f4a"; };
const DEFAULT = DEFAULT_MENU;
let data;

firebase.initializeApp(FIREBASE_CONFIG);
firebase.firestore().settings({experimentalForceLongPolling: true, useFetchStreams: false});
const ref = firebase.firestore().doc("config/menu");

firebase.auth().onAuthStateChanged(async u => {
  $("login").classList.toggle("hide", !!u); $("editor").classList.toggle("hide", !u); $("save").classList.toggle("hide", !u);
  if (!u) return;
  try { const s = await ref.get(); data = s.exists ? s.data() : DEFAULT; fill(); say("Đã tải menu."); }
  catch (e) { say("Không tải được menu (" + e.message + "). Thử tải lại trang, đổi sang wifi, hoặc kiểm tra Firestore đã được tạo chưa.", true); }
});
$("signin").onclick = async () => {
  try { say("Đang đăng nhập..."); await firebase.auth().signInWithEmailAndPassword($("email").value.trim(), $("pass").value); }
  catch (e) { say("Sai email hoặc mật khẩu.", true); }
};
$("signout").onclick = () => firebase.auth().signOut();

const COLORS = [
  ["bg", "Nền trang"], ["ink", "Chữ chính (tên món, giá)"], ["muted", "Chữ phụ (mô tả món)"],
  ["accent", "Màu nhấn (nút +, viền, nhãn bán chạy)"], ["accentInk", "Chữ trên màu nhấn"],
  ["line", "Đường kẻ giữa các món"], ["card", "Nền hộp đơn hàng và ô nhập"],
  ["heroBg", "Nền banner và thanh nhóm món"], ["heroInk", "Chữ banner và thanh nhóm món"],
  ["barBg", "Nền thanh giỏ hàng"], ["barInk", "Chữ thanh giỏ hàng"]
];
function paintSw(k) { const v = $("col-" + k).value.trim(); $("sw-" + k).style.background = v && CSS.supports("color", v) ? v : ""; }
function drawColors() {
  const c = data.colors || {};
  $("colors").innerHTML = COLORS.map(([k, l]) => `<div class="cr"><label for="col-${k}">${l}</label><div class="cw"><span class="sw" id="sw-${k}"></span><input id="col-${k}" value="${val(c[k])}" placeholder="tự động" autocapitalize="off" autocomplete="off" spellcheck="false"></div></div>`).join("");
  COLORS.forEach(([k]) => paintSw(k));
}
$("colors").addEventListener("input", e => { if (e.target.id.startsWith("col-")) paintSw(e.target.id.slice(4)); });
function readColors() {
  const out = {};
  for (const [k] of COLORS) { const v = $("col-" + k).value.trim(); if (v) out[k] = v; }
  const D = DEFAULT_MENU.colors;
  for (const k of ["bg", "ink", "accent"]) if (!out[k]) out[k] = D[k];
  return out;
}
function fill() {
  $("shop").value = data.shop; $("tagline").value = data.tagline || "";
  drawColors();
  drawCats();
}
function drawCats() {
  $("cats").innerHTML = data.categories.map((c, ci) => `
    <div class="cat" data-ci="${ci}">
      <div class="cat-head"><input class="cn" value="${val(c.name)}" aria-label="Tên nhóm"><button class="del" data-act="delcat">Xóa nhóm</button></div>
      ${c.items.map((i, ii) => `<div class="it" data-ii="${ii}" data-img="${val(i.img)}">
        <div class="phw"><label class="ph" title="Chọn ảnh"><img class="pv" alt="" ${i.img ? "" : "hidden"}><span class="plus" ${i.img ? "hidden" : ""}>+</span><input type="file" accept="image/*" class="f" hidden></label><button type="button" class="x" data-act="delimg" aria-label="Xóa ảnh" ${i.img ? "" : "hidden"}>×</button></div>
        <input class="n" value="${val(i.name)}" placeholder="Tên món" aria-label="Tên món">
        <input class="d" value="${val(i.desc)}" placeholder="Mô tả" aria-label="Mô tả">
        <input class="p" type="number" min="0" step="1000" value="${i.price}" placeholder="Giá" aria-label="Giá">
        <label class="bs"><input type="checkbox" class="b" ${i.best ? "checked" : ""}> Bán chạy</label>
        <button class="del" data-act="delitem">Xóa</button></div>`).join("")}
      <p><button data-act="additem">+ Thêm món</button></p>
    </div>`).join("");
  loadPreviews();
}
function collect() {
  data.shop = $("shop").value.trim(); data.tagline = $("tagline").value.trim();
  data.colors = readColors();
  data.categories = [...document.querySelectorAll(".cat")].map(c => ({
    name: c.querySelector(".cn").value.trim(),
    items: [...c.querySelectorAll(".it")].map(r => ({name:r.querySelector(".n").value.trim(), desc:r.querySelector(".d").value.trim(), price:Number(r.querySelector(".p").value)||0, best:r.querySelector(".b").checked, img:r.dataset.img || ""})).filter(i => i.name)
  })).filter(c => c.name);
}
$("cats").addEventListener("click", e => {
  const a = e.target.dataset.act; if (!a) return;
  collect();
  const ci = +e.target.closest(".cat").dataset.ci;
  if (a === "delcat") data.categories.splice(ci, 1);
  if (a === "additem") data.categories[ci].items.push({name:"Món mới", desc:"", price:0});
  if (a === "delimg") data.categories[ci].items[+e.target.closest(".it").dataset.ii].img = "";
  if (a === "delitem") data.categories[ci].items.splice(+e.target.closest(".it").dataset.ii, 1);
  drawCats();
});
$("addcat").onclick = () => { collect(); data.categories.push({name:"Nhóm mới", items:[{name:"Món mới", desc:"", price:0}]}); drawCats(); };
const imgMem = {};
async function loadImage(id) {
  if (imgMem[id]) return imgMem[id];
  try { const c = localStorage.getItem("img_" + id); if (c) return (imgMem[id] = c); } catch (e) {}
  const s = await firebase.firestore().doc("images/" + id).get();
  if (!s.exists) return "";
  const d = s.data().data; imgMem[id] = d;
  try { localStorage.setItem("img_" + id, d); } catch (e) {}
  return d;
}
const pending = {};
function loadPreviews() {
  document.querySelectorAll(".it").forEach(async row => {
    const id = row.dataset.img; if (!id) return;
    const pv = row.querySelector(".pv");
    try { const d = pending[id] || await loadImage(id); if (d) pv.src = d; } catch (e) {}
  });
}
function resize(file, max = 480, q = 0.72) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => rej(new Error("Không đọc được ảnh này")); img.src = url;
  });
}
$("cats").addEventListener("change", async e => {
  if (!e.target.classList.contains("f") || !e.target.files[0]) return;
  const row = e.target.closest(".it");
  try {
    const d = await resize(e.target.files[0]);
    const id = "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    pending[id] = d; row.dataset.img = id;
    const pv = row.querySelector(".pv"); pv.src = d; pv.hidden = false;
    row.querySelector(".plus").hidden = true; row.querySelector(".x").hidden = false;
  } catch (err) { say(err.message, true); }
});
async function saveImages() {
  const used = new Set(data.categories.flatMap(c => c.items.map(i => i.img)).filter(Boolean));
  for (const id of Object.keys(pending)) {
    if (!used.has(id)) { delete pending[id]; continue; }
    await firebase.firestore().doc("images/" + id).set({ data: pending[id] });
    try { localStorage.setItem("img_" + id, pending[id]); } catch (e) {}
    delete pending[id];
  }
}
$("save").onclick = async () => {
  collect();
  if (!data.shop) return say("Cần điền tên quán.", true);
  for (const [k, l] of COLORS) { const v = data.colors[k]; if (v && !CSS.supports("color", v)) return say("Màu không hợp lệ ở mục \"" + l + "\": " + v + ". Ví dụ đúng: #c9972b (6 ký tự sau dấu #)", true); }
  try { say("Đang lưu..."); await saveImages(); await ref.set(data); say("Đã lưu. Khách tải lại trang là thấy menu mới."); }
  catch (e) { say("Lưu thất bại: kiểm tra đã dán Rules mới (có phần images) chưa.", true); }
};
</script>
</body>
</html>
