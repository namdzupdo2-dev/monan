<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Quản lý menu</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f2f0;color:#222;font:15px/1.5 system-ui,sans-serif;padding:16px 16px 100px}
.wrap{max-width:760px;margin:auto}
h1{font-size:1.4rem;margin:0 0 12px}
section{background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;margin-bottom:16px}
h2{font-size:1.05rem;margin:0 0 10px}
label{display:block;font-size:.85rem;color:#555;margin:10px 0 3px}
input{width:100%;padding:8px;border:1px solid #bbb;border-radius:6px;font:inherit}
input[type=color]{padding:2px;height:40px;width:70px}
.colors{display:flex;gap:18px;flex-wrap:wrap}
.cat{border:1px solid #ccc;border-radius:8px;padding:12px;margin-top:12px;background:#fafafa}
.cat-head{display:flex;gap:8px}
.it{display:grid;grid-template-columns:2fr 2fr 1fr auto auto;gap:6px;margin-top:8px;align-items:center}
.bs{display:flex;align-items:center;gap:4px;margin:0;white-space:nowrap;font-size:.85rem}.bs input{width:auto}
@media(max-width:560px){.it{grid-template-columns:1fr 1fr}.it button,.bs{grid-column:span 2}}
button{padding:8px 12px;border-radius:6px;border:1px solid #888;background:#fff;font:inherit;cursor:pointer}
button.pri{background:#1f5f4a;color:#fff;border-color:#1f5f4a;font-weight:600}
button.del{color:#b00020;border-color:#e0b0b8}
button:focus-visible,input:focus-visible{outline:3px solid #1f5f4a;outline-offset:2px}
#save{position:fixed;left:0;right:0;bottom:0;border-radius:0;padding:16px;border:0}
#status{margin:8px 0;font-weight:600}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>Quản lý menu</h1>
<div id="status" role="status"></div>

<section id="login">
  <h2>Đăng nhập chủ quán</h2>
  <label for="email">Email</label><input id="email" type="email" autocomplete="username">
  <label for="pass">Mật khẩu</label><input id="pass" type="password" autocomplete="current-password">
  <p><button class="pri" id="signin">Đăng nhập</button></p>
</section>

<div id="editor" class="hide">
  <p><button id="signout">Đăng xuất</button></p>
  <section>
    <h2>Thông tin quán</h2>
    <label for="shop">Tên quán</label><input id="shop">
    <label for="tagline">Câu giới thiệu</label><input id="tagline">
  </section>
  <section>
    <h2>Màu sắc</h2>
    <div class="colors">
      <div><label for="c-bg">Màu nền</label><input type="color" id="c-bg"></div>
      <div><label for="c-ink">Màu chữ</label><input type="color" id="c-ink"></div>
      <div><label for="c-accent">Màu nút chính</label><input type="color" id="c-accent"></div>
    </div>
  </section>
  <section>
    <h2>Món ăn</h2>
    <div id="cats"></div>
    <p><button id="addcat">+ Thêm nhóm món</button></p>
  </section>
</div>
</div>
<button class="pri hide" id="save" type="button">Lưu, khách thấy ngay</button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const val = s => String(s ?? "").replace(/"/g,"&quot;");
const say = (t, bad) => { $("status").textContent = t; $("status").style.color = bad ? "#b00020" : "#1f5f4a"; };
const DEFAULT = DEFAULT_MENU;
let data;

firebase.initializeApp(FIREBASE_CONFIG);
const ref = firebase.firestore().doc("config/menu");

firebase.auth().onAuthStateChanged(async u => {
  $("login").classList.toggle("hide", !!u); $("editor").classList.toggle("hide", !u); $("save").classList.toggle("hide", !u);
  if (!u) return;
  try { const s = await ref.get(); data = s.exists ? s.data() : DEFAULT; fill(); say("Đã tải menu."); }
  catch (e) { say("Không tải được menu: " + e.message, true); }
});
$("signin").onclick = async () => {
  try { say("Đang đăng nhập..."); await firebase.auth().signInWithEmailAndPassword($("email").value.trim(), $("pass").value); }
  catch (e) { say("Sai email hoặc mật khẩu.", true); }
};
$("signout").onclick = () => firebase.auth().signOut();

function fill() {
  $("shop").value = data.shop; $("tagline").value = data.tagline || "";
  $("c-bg").value = data.colors.bg; $("c-ink").value = data.colors.ink; $("c-accent").value = data.colors.accent;
  drawCats();
}
function drawCats() {
  $("cats").innerHTML = data.categories.map((c, ci) => `
    <div class="cat" data-ci="${ci}">
      <div class="cat-head"><input class="cn" value="${val(c.name)}" aria-label="Tên nhóm"><button class="del" data-act="delcat">Xóa nhóm</button></div>
      ${c.items.map((i, ii) => `<div class="it" data-ii="${ii}">
        <input class="n" value="${val(i.name)}" placeholder="Tên món" aria-label="Tên món">
        <input class="d" value="${val(i.desc)}" placeholder="Mô tả" aria-label="Mô tả">
        <input class="p" type="number" min="0" step="1000" value="${i.price}" placeholder="Giá" aria-label="Giá">
        <label class="bs"><input type="checkbox" class="b" ${i.best ? "checked" : ""}> Bán chạy</label>
        <button class="del" data-act="delitem">Xóa</button></div>`).join("")}
      <p><button data-act="additem">+ Thêm món</button></p>
    </div>`).join("");
}
function collect() {
  data.shop = $("shop").value.trim(); data.tagline = $("tagline").value.trim();
  data.colors = {bg:$("c-bg").value, ink:$("c-ink").value, accent:$("c-accent").value};
  data.categories = [...document.querySelectorAll(".cat")].map(c => ({
    name: c.querySelector(".cn").value.trim(),
    items: [...c.querySelectorAll(".it")].map(r => ({name:r.querySelector(".n").value.trim(), desc:r.querySelector(".d").value.trim(), price:Number(r.querySelector(".p").value)||0, best:r.querySelector(".b").checked})).filter(i => i.name)
  })).filter(c => c.name);
}
$("cats").addEventListener("click", e => {
  const a = e.target.dataset.act; if (!a) return;
  collect();
  const ci = +e.target.closest(".cat").dataset.ci;
  if (a === "delcat") data.categories.splice(ci, 1);
  if (a === "additem") data.categories[ci].items.push({name:"Món mới", desc:"", price:0});
  if (a === "delitem") data.categories[ci].items.splice(+e.target.closest(".it").dataset.ii, 1);
  drawCats();
});
$("addcat").onclick = () => { collect(); data.categories.push({name:"Nhóm mới", items:[{name:"Món mới", desc:"", price:0}]}); drawCats(); };
$("save").onclick = async () => {
  collect();
  if (!data.shop) return say("Cần điền tên quán.", true);
  try { say("Đang lưu..."); await ref.set(data); say("Đã lưu. Khách tải lại trang là thấy menu mới."); }
  catch (e) { say("Lưu thất bại: tài khoản chưa có quyền ghi (kiểm tra rules).", true); }
};
</script>
</body>
</html>
