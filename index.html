<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đặt món</title>
<style>
:root{--bg:#f6f1e7;--ink:#2b2118;--accent:#1f5f4a;--accent-ink:#fff;
--card:color-mix(in srgb,var(--bg) 55%,#fff);--muted:color-mix(in srgb,var(--ink) 60%,var(--bg));--line:color-mix(in srgb,var(--ink) 18%,var(--bg))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif;padding-bottom:90px}
header{padding:28px 18px 8px;max-width:720px;margin:auto}
h1{font-size:2rem;margin:0}
header p{margin:4px 0 0;color:var(--muted)}
main{max-width:720px;margin:auto;padding:0 18px}
h2{font-size:1.15rem;margin:26px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.item .info{flex:1}.item b{display:block}.item span{color:var(--muted);font-size:.9rem}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--ink);background:var(--card);color:var(--ink);font-size:1.1rem;cursor:pointer}
.qty output{min-width:18px;text-align:center}
.best{font-style:normal;font-size:.72rem;font-weight:bold;color:var(--accent-ink);background:var(--accent);padding:1px 8px;border-radius:10px;margin-left:6px;white-space:nowrap;vertical-align:middle}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--accent);color:var(--accent-ink);padding:14px 18px;display:flex;justify-content:space-between;border:0;font:inherit;font-weight:bold;cursor:pointer;width:100%}
dialog{width:min(520px,94vw);border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;margin:12px 0 4px;font-size:.9rem;color:var(--muted)}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;justify-content:space-between;padding:3px 0}
.actions{display:flex;gap:10px;margin-top:18px}
.actions button{flex:1;padding:12px;border-radius:6px;border:1px solid var(--ink);font:inherit;cursor:pointer;background:var(--card);color:var(--ink)}
.actions .go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:bold}
#msg{margin-top:10px;font-size:.9rem}
</style>
</head>
<body>
<header><h1 id="shop">Đặt món</h1><p id="tag"></p></header>
<main id="menu">Đang tải menu...</main>
<button id="bar" type="button"><span id="count">Chưa chọn món</span><span id="total">0đ</span></button>

<dialog id="dlg">
  <h3 style="margin-top:0">Xác nhận đơn</h3>
  <div id="summary"></div>
  <label for="name">Tên của bạn</label><input id="name" autocomplete="name">
  <label for="phone">Số điện thoại</label><input id="phone" type="tel" autocomplete="tel">
  <label for="place">Số bàn hoặc địa chỉ giao hàng</label><input id="place">
  <label for="note">Ghi chú</label><textarea id="note" rows="2"></textarea>
  <div id="msg" role="status"></div>
  <div class="actions"><button type="button" id="close">Quay lại</button><button type="button" class="go" id="send">Gửi đơn</button></div>
</dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString("vi-VN") + "đ";
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
let DATA, all = [], cart = {};

function lum(hex){const n=parseInt(hex.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255].reduce((s,c,i)=>s+c*[.2126,.7152,.0722][i],0)}
function render(){
  document.title = DATA.shop; $("shop").textContent = DATA.shop; $("tag").textContent = DATA.tagline || "";
  const r = document.documentElement.style, c = DATA.colors;
  r.setProperty("--bg",c.bg); r.setProperty("--ink",c.ink); r.setProperty("--accent",c.accent);
  r.setProperty("--accent-ink", lum(c.accent) > 140 ? "#111" : "#fff");
  let id = 0; all = [];
  $("menu").innerHTML = DATA.categories.map(c => `<h2>${esc(c.name)}</h2>` + c.items.map(i => {
    i.id = ++id; all.push(i);
    return `<div class="item"><div class="info"><b>${esc(i.name)}${i.best ? ' <em class="best">★ Bán chạy</em>' : ""}</b><span>${i.desc ? esc(i.desc) + " · " : ""}${fmt(i.price)}</span></div>
    <div class="qty"><button type="button" aria-label="Bớt ${esc(i.name)}" data-id="${i.id}" data-d="-1">−</button><output id="q${i.id}">0</output>
    <button type="button" aria-label="Thêm ${esc(i.name)}" data-id="${i.id}" data-d="1">+</button></div></div>`;
  }).join("")).join("");
}
function totals(){let n=0,t=0;for(const i of all){const q=cart[i.id]||0;n+=q;t+=q*i.price}return{n,t}}
function refresh(){const{n,t}=totals();$("count").textContent=n?`${n} món – Xem đơn`:"Chưa chọn món";$("total").textContent=fmt(t)}

$("menu").addEventListener("click", e => {
  const b = e.target.closest("button[data-id]"); if(!b) return;
  const id=+b.dataset.id, q=Math.max(0,(cart[id]||0)+ +b.dataset.d);
  cart[id]=q; $("q"+id).textContent=q; refresh();
});
$("bar").onclick = () => {
  const{n,t}=totals(); if(!n) return;
  $("summary").innerHTML = all.filter(i=>cart[i.id]).map(i=>`<div class="row"><span>${cart[i.id]} × ${esc(i.name)}</span><span>${fmt(cart[i.id]*i.price)}</span></div>`).join("")+`<div class="row"><b>Tổng</b><b>${fmt(t)}</b></div>`;
  $("msg").textContent=""; $("send").disabled=false; $("dlg").showModal();
};
$("close").onclick = () => $("dlg").close();
$("send").onclick = async () => {
  if(!$("name").value.trim()||!$("phone").value.trim()||!$("place").value.trim()){$("msg").textContent="Vui lòng điền tên, số điện thoại và bàn/địa chỉ.";return}
  const lines = all.filter(i=>cart[i.id]).map(i=>`• ${cart[i.id]} x ${i.name} = ${fmt(cart[i.id]*i.price)}`);
  const text = `ĐƠN HÀNG MỚI\n${lines.join("\n")}\nTổng: ${fmt(totals().t)}\n\nKhách: ${$("name").value}\nSĐT: ${$("phone").value}\nBàn/Địa chỉ: ${$("place").value}\nGhi chú: ${$("note").value||"không"}`;
  $("send").disabled = true; $("msg").textContent = "Đang gửi đơn...";
  try {
    const r = await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({chat_id:TG_CHAT_ID, text})});
    if(!r.ok) throw 0;
    $("msg").textContent = "Đã gửi đơn. Quán sẽ liên hệ bạn sớm.";
    cart = {}; all.forEach(i => $("q"+i.id).textContent = 0); refresh();
    setTimeout(() => $("dlg").close(), 2000);
  } catch { $("msg").textContent = "Gửi chưa được. Kiểm tra mạng rồi thử lại."; $("send").disabled = false; }
};

firebase.initializeApp(FIREBASE_CONFIG);
firebase.firestore().doc("config/menu").get().then(s => {
  DATA = s.exists ? s.data() : DEFAULT_MENU; render(); refresh();
}).catch(() => { DATA = DEFAULT_MENU; render(); refresh(); });
</script>
</body>
</html>
