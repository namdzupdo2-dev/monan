<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đặt món</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3e9d2;--ink:#26332b;--accent:#c9972b;--accent-ink:#1b1b1b;
--card:color-mix(in srgb,var(--bg) 65%,#fff);--muted:color-mix(in srgb,var(--ink) 62%,var(--bg));--line:color-mix(in srgb,var(--ink) 24%,var(--bg));
--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
html{scroll-padding-top:56px}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Lora,Georgia,serif;padding-bottom:84px}
.hero{background:var(--ink);color:var(--bg);text-align:center;padding:30px 16px 28px}
.frame{max-width:560px;margin:auto;border:1px solid var(--accent);padding:6px}
.frame>div{border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);padding:26px 14px 24px}
h1{font:700 clamp(2.3rem,9vw,3.5rem)/1.02 var(--serif);margin:0}
.orn{display:flex;align-items:center;gap:10px;max-width:240px;margin:14px auto;color:var(--accent);font-size:.7rem}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:var(--accent)}
.tag{margin:0;font-style:italic;font-size:.95rem;opacity:.9}
nav{position:sticky;top:0;z-index:5;display:flex;gap:2px;overflow-x:auto;padding:0 8px;background:var(--ink);border-top:1px solid var(--accent);border-bottom:2px solid var(--accent);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;padding:11px 12px;color:var(--bg);text-decoration:none;font:600 1.12rem var(--serif);opacity:.78}
nav a.on{color:var(--accent);opacity:1;box-shadow:inset 0 -3px var(--accent)}
main{max-width:680px;margin:auto;padding:4px 18px}
.cat{margin-top:34px}
.cat h2{display:flex;align-items:center;gap:14px;margin:0 0 4px;font:700 1.75rem var(--serif);text-align:center}
.cat h2::before,.cat h2::after{content:"";flex:1;border-top:4px double var(--accent)}
.item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.thumb{flex:none;width:68px;height:80px;object-fit:cover;padding:2px;border:2px solid var(--accent);border-radius:34px 34px 6px 6px;background:var(--card)}
.info{flex:1;min-width:0}
.top{display:flex;align-items:baseline;gap:8px}
.nm{font-weight:600}
.dots{flex:1;min-width:10px;border-bottom:2px dotted var(--line);transform:translateY(-4px)}
.pr{font:700 1.25rem var(--serif);white-space:nowrap}
.ds{display:block;margin-top:1px;font-style:italic;color:var(--muted);font-size:.87rem}
.best{display:inline-block;margin-left:6px;padding:0 7px;border-radius:3px;background:var(--accent);color:var(--accent-ink);font:600 .7rem/1.6 Lora,Georgia,serif;white-space:nowrap;vertical-align:middle}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-size:1.2rem;line-height:1;cursor:pointer}
.qty button[data-d="1"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qty output{min-width:20px;text-align:center;font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible,nav a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#bar{position:fixed;left:0;right:0;bottom:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 20px;background:var(--ink);color:var(--bg);border:0;border-top:3px solid var(--accent);font:600 1.15rem var(--serif);cursor:pointer}
#total{color:var(--accent);font-size:1.4rem}
dialog{width:min(520px,94vw);padding:22px;background:var(--bg);color:var(--ink);border:4px double var(--accent);border-radius:4px}
dialog::backdrop{background:rgba(20,25,20,.6)}
dialog h3{margin:0 0 8px;font:700 1.6rem var(--serif)}
label{display:block;margin:12px 0 4px;font-size:.88rem;color:var(--muted)}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);font:inherit}
.row{display:flex;justify-content:space-between;padding:3px 0}
.row.sum{margin-top:6px;padding-top:8px;border-top:1px solid var(--ink);font-size:1.1rem}
.actions{display:flex;gap:10px;margin-top:18px}
.actions button{flex:1;padding:12px;border-radius:4px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:600 1rem Lora,Georgia,serif;cursor:pointer}
.actions .go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.actions button:disabled{opacity:.6}
#msg{margin-top:10px;font-size:.9rem}
[hidden]{display:none!important}
dialog{max-height:92vh;overflow:auto}
.pay{text-align:center}
.pay .code{margin:0;font:700 2.7rem/1.1 var(--serif);letter-spacing:.06em}
.pay .lead{margin:6px 0;color:var(--muted);font-size:.9rem}
#qr{display:inline-block;margin:8px auto;padding:12px;background:#fff;border:1px solid var(--line);border-radius:6px;line-height:0}
#qr img,#qr canvas{width:230px;height:230px;max-width:100%}
.bank{text-align:left;margin-top:8px}
.bank .row{align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.bank .row>span{flex:none;color:var(--muted);font-size:.88rem}
.bank .row>b{text-align:right;word-break:break-all}
.cp{margin-left:8px;padding:2px 10px;border:1px solid var(--ink);border-radius:4px;background:transparent;color:var(--ink);font:600 .8rem Lora,Georgia,serif;cursor:pointer}
.note{margin:12px 0 0;font-size:.88rem;color:var(--muted)}
</style>
</head>
<body>
<header class="hero"><div class="frame"><div>
  <h1 id="shop">Đặt món</h1>
  <div class="orn" aria-hidden="true">◆</div>
  <p class="tag" id="tag"></p>
</div></div></header>
<nav id="nav" aria-label="Nhóm món"></nav>
<main id="menu">Đang tải menu...</main>
<button id="bar" type="button"><span id="count">Chưa chọn món</span><span id="total">0đ</span></button>

<dialog id="dlg">
  <div id="formView">
    <h3>Xác nhận đơn</h3>
    <div id="summary"></div>
    <label for="name">Tên của bạn</label><input id="name" autocomplete="name">
    <label for="phone">Số điện thoại</label><input id="phone" type="tel" autocomplete="tel">
    <label for="place">Số bàn hoặc địa chỉ giao hàng</label><input id="place">
    <label for="note">Ghi chú</label><textarea id="note" rows="2"></textarea>
    <div id="msg" role="status"></div>
    <div class="actions"><button type="button" id="close">Quay lại</button><button type="button" class="go" id="send">Đặt đơn</button></div>
  </div>
  <div id="payView" class="pay" hidden>
    <p class="lead">Đã gửi đơn cho quán. Mã đơn của bạn</p>
    <p class="code" id="pCode"></p>
    <p class="lead">Quét mã bằng app ngân hàng để thanh toán</p>
    <div id="qr"></div>
    <div class="bank">
      <div class="row"><span>Ngân hàng</span><b id="pBank"></b></div>
      <div class="row"><span>Chủ tài khoản</span><b id="pHolder"></b></div>
      <div class="row"><span>Số tài khoản</span><b><span id="pAcc"></span><button type="button" class="cp" data-copy="pAcc">Sao chép</button></b></div>
      <div class="row"><span>Số tiền</span><b id="pTotal"></b></div>
      <div class="row"><span>Nội dung</span><b><span id="pMemo"></span><button type="button" class="cp" data-copy="pMemo">Sao chép</button></b></div>
    </div>
    <p class="note">Hãy giữ mã đơn để nhận món. Quán sẽ xác nhận khi nhận được tiền.</p>
    <div class="actions"><button type="button" class="go" id="done">Xong</button></div>
  </div>
</dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString("vi-VN") + "đ";
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
let DATA, all = [], cart = {}, io;

function lum(hex){const n=parseInt(hex.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255].reduce((s,c,i)=>s+c*[.2126,.7152,.0722][i],0)}
function render(){
  document.title = DATA.shop; $("shop").textContent = DATA.shop; $("tag").textContent = DATA.tagline || "";
  const r = document.documentElement.style, c = DATA.colors;
  r.setProperty("--bg",c.bg); r.setProperty("--ink",c.ink); r.setProperty("--accent",c.accent);
  r.setProperty("--accent-ink", lum(c.accent) > 140 ? "#1b1b1b" : "#fff");
  let id = 0; all = [];
  $("menu").innerHTML = DATA.categories.map((c, ci) => `<section class="cat" id="c${ci}"><h2>${esc(c.name)}</h2>` + c.items.map(i => {
    i.id = ++id; all.push(i);
    return `<div class="item">${i.img ? `<img class="thumb" data-img="${esc(i.img)}" alt="">` : ""}
      <div class="info"><div class="top"><span class="nm">${esc(i.name)}${i.best ? '<span class="best">★ Bán chạy</span>' : ""}</span><span class="dots"></span><span class="pr">${fmt(i.price)}</span></div>
      ${i.desc ? `<span class="ds">${esc(i.desc)}</span>` : ""}</div>
      <div class="qty"><button type="button" aria-label="Bớt ${esc(i.name)}" data-id="${i.id}" data-d="-1">−</button><output id="q${i.id}">0</output>
      <button type="button" aria-label="Thêm ${esc(i.name)}" data-id="${i.id}" data-d="1">+</button></div></div>`;
  }).join("") + `</section>`).join("");
  $("nav").innerHTML = DATA.categories.map((c, ci) => `<a href="#c${ci}">${esc(c.name)}</a>`).join("");
  watchSections(); loadThumbs();
}
function watchSections(){
  if (io) io.disconnect();
  const links = [...$("nav").children];
  io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    links.forEach(l => l.classList.toggle("on", l.hash === "#" + e.target.id));
    const nv = $("nav"), on = nv.querySelector(".on"); if (on) nv.scrollTo({left: on.offsetLeft - (nv.clientWidth - on.offsetWidth) / 2});
  }), {rootMargin:"-30% 0px -65% 0px"});
  document.querySelectorAll(".cat").forEach(s => io.observe(s));
}
function loadThumbs(){
  document.querySelectorAll("img.thumb").forEach(async el => {
    try { const d = await loadImage(el.dataset.img); if (d) el.src = d; else el.remove(); } catch (e) { el.remove(); }
  });
}
function totals(){let n=0,t=0;for(const i of all){const q=cart[i.id]||0;n+=q;t+=q*i.price}return{n,t}}
function refresh(){const{n,t}=totals();$("count").textContent=n?`${n} món – Xem đơn`:"Chưa chọn món";$("total").textContent=fmt(t)}

$("menu").addEventListener("click", e => {
  const b = e.target.closest("button[data-id]"); if(!b) return;
  const id=+b.dataset.id, q=Math.max(0,(cart[id]||0)+ +b.dataset.d);
  cart[id]=q; $("q"+id).textContent=q; refresh();
});
const ORDER_URL = typeof ORDER_ENDPOINT !== "undefined" ? ORDER_ENDPOINT : "";
const PAY = typeof BANK !== "undefined" ? BANK : {bin:"970436", name:"Vietcombank", account:"1066613219", holder:"HUYNH YEN PHUONG"};
let orderCode = null;
$("bar").onclick = () => {
  const{n,t}=totals(); if(!n) return;
  $("summary").innerHTML = all.filter(i=>cart[i.id]).map(i=>`<div class="row"><span>${cart[i.id]} × ${esc(i.name)}</span><span>${fmt(cart[i.id]*i.price)}</span></div>`).join("")+`<div class="row sum"><b>Tổng</b><b>${fmt(t)}</b></div>`;
  $("formView").hidden = false; $("payView").hidden = true;
  $("msg").textContent=""; $("send").disabled=false; $("dlg").showModal();
};
$("close").onclick = () => $("dlg").close();
$("done").onclick = () => $("dlg").close();

/* Mã đơn 5 số, không trùng trong ngày (giờ Việt Nam) */
const dayKey = () => new Date(Date.now() + 7 * 3600 * 1000).toISOString().slice(0, 10).replace(/-/g, "");
const rand5 = () => String(10000 + Math.floor(Math.random() * 90000));
async function newCode() {
  const db = firebase.firestore(), day = dayKey();
  for (let i = 0; i < 25; i++) {
    const code = rand5(), ref = db.doc("orderCodes/" + day + "-" + code);
    try {
      if ((await ref.get()).exists) continue;
      await ref.set({t: firebase.firestore.FieldValue.serverTimestamp()});
      return code;
    } catch (e) { if (e.code === "permission-denied") continue; break; }
  }
  return rand5(); // dự phòng khi database không phản hồi
}

/* VietQR (chuẩn NAPAS 247) */
const tlv = (id, v) => id + String(v.length).padStart(2, "0") + v;
function crc16(s) {
  let c = 0xFFFF;
  for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; }
  return c.toString(16).toUpperCase().padStart(4, "0");
}
function vietQR(bin, acc, amount, memo) {
  const merchant = tlv("00", "A000000727") + tlv("01", tlv("00", bin) + tlv("01", acc)) + tlv("02", "QRIBFTTA");
  let p = tlv("00", "01") + tlv("01", amount ? "12" : "11") + tlv("38", merchant) + tlv("53", "704");
  if (amount) p += tlv("54", String(amount));
  p += tlv("58", "VN");
  if (memo) p += tlv("62", tlv("08", memo));
  p += "6304";
  return p + crc16(p);
}
function showPay(code, total, memo) {
  $("pCode").textContent = "#" + code; $("pTotal").textContent = fmt(total); $("pMemo").textContent = memo;
  $("pBank").textContent = PAY.name; $("pHolder").textContent = PAY.holder; $("pAcc").textContent = PAY.account;
  const box = $("qr"); box.innerHTML = "";
  try { new QRCode(box, {text: vietQR(PAY.bin, PAY.account, total, memo), width: 230, height: 230, correctLevel: QRCode.CorrectLevel.M}); }
  catch (e) { box.style.lineHeight = "1.4"; box.textContent = "Không tạo được mã QR. Vui lòng chuyển khoản theo số tài khoản bên dưới."; }
  $("formView").hidden = true; $("payView").hidden = false;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  const v = $(b.dataset.copy).textContent;
  const ok = () => { b.textContent = "Đã chép"; setTimeout(() => b.textContent = "Sao chép", 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(v).then(ok, () => {}); else ok();
});

$("send").onclick = async () => {
  if(!$("name").value.trim()||!$("phone").value.trim()||!$("place").value.trim()){$("msg").textContent="Vui lòng điền tên, số điện thoại và bàn/địa chỉ.";return}
  $("send").disabled = true; $("msg").textContent = "Đang gửi đơn...";
  let sent = false;
  try {
    if (!orderCode) orderCode = await Promise.race([newCode(), new Promise(r => setTimeout(() => r(rand5()), 4000))]);
    const code = orderCode, total = totals().t, memo = "DON" + code;
    const lines = all.filter(i=>cart[i.id]).map(i=>`• ${cart[i.id]} x ${i.name} = ${fmt(cart[i.id]*i.price)}`);
    const text = `ĐƠN HÀNG MỚI #${code}\n${lines.join("\n")}\nTổng: ${fmt(total)}\n\nKhách: ${$("name").value}\nSĐT: ${$("phone").value}\nBàn/Địa chỉ: ${$("place").value}\nGhi chú: ${$("note").value||"không"}\n\nThanh toán: chuyển khoản ${PAY.name}, nội dung ${memo}`;
    const r = ORDER_URL
      ? await fetch(ORDER_URL, {method:"POST", headers:{"Content-Type":"text/plain"}, body:JSON.stringify({text})})
      : await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({chat_id:TG_CHAT_ID, text})});
    if (!r.ok) throw new Error("Telegram " + r.status);
    sent = true; orderCode = null;
    cart = {}; all.forEach(i => $("q"+i.id).textContent = 0); refresh();
    showPay(code, total, memo);
  } catch (e) {
    if (sent) { $("msg").textContent = "Đã gửi đơn cho quán. Quán sẽ liên hệ bạn."; }
    else { $("msg").textContent = "Gửi chưa được (" + (e && e.message ? e.message : "lỗi mạng") + "). Bấm Đặt đơn để thử lại."; $("send").disabled = false; }
  }
};

const imgMem = {};
async function loadImage(id) {
  if (imgMem[id]) return imgMem[id];
  try { const c = localStorage.getItem("img_" + id); if (c) return (imgMem[id] = c); } catch (e) {}
  const s = await firebase.firestore().doc("images/" + id).get();
  if (!s.exists) return "";
  const d = s.data().data; imgMem[id] = d;
  try { localStorage.setItem("img_" + id, d); } catch (e) {}
  return d;
}

firebase.initializeApp(FIREBASE_CONFIG);
firebase.firestore().settings({experimentalForceLongPolling: true, useFetchStreams: false});
const show = d => { DATA = d; cart = {}; render(); refresh(); };
const timer = setTimeout(() => show(DEFAULT_MENU), 5000);
firebase.firestore().doc("config/menu").get()
  .then(s => { clearTimeout(timer); show(s.exists ? s.data() : DEFAULT_MENU); })
  .catch(() => { clearTimeout(timer); show(DEFAULT_MENU); });
</script>
</body>
</html>
